<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naver Blog Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Naver Blog Assistant</h1>

      <p id="status">
        네이버 블로그 글에 기본 좋아요(하트)를 누르거나 좋아요와 댓글을 한 번에 처리할 수 있습니다.
      </p>

      <button id="like-post" type="button">
        좋아요 누르기
      </button>

      <button id="like-and-comment" type="button">
        좋아요 → 댓글 달기
      </button>

      <button id="create-draft" type="button">
        AI 댓글 작성
      </button>

      <button id="mark-complete" type="button" disabled>
        댓글 등록 후 완료로 기록
      </button>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
