<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naver Blog Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Naver Blog Assistant</h1>
      <p id="status">현재 글을 읽어 댓글 초안을 만들 수 있습니다.</p>
      <button id="create-draft" type="button">댓글 초안 만들기</button>
      <label for="draft">검토 후 직접 등록하세요</label>
      <textarea id="draft" rows="6" placeholder="초안이 여기에 표시됩니다."></textarea>
      <button id="copy-draft" type="button" disabled>초안 복사</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
